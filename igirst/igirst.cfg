#!/bin/bash

# IGIR Shell Tools MUST be restarted to pick up any changes to this file

### 7z Support - Used automatically where supported and requirements met
	# More details at - https://github.com/kencinder/igirst/wiki/config#7z-support

	# 7z command - Command of '7z' or absolute path to a binary, if unset 7z Support will be disabled
		_7z_command="7z"
	# 7z arguments eg; "-m0=lzma2 -mx=9 -mfb=256 -md=512m -ms=on". If none set, defaults used
		_7z_args=""


#            ##### \\\\\ These settings are MANDATORY for any system you use and can not be empty ///// #####

