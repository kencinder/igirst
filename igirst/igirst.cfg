			# Backup for cleanup - Backups are not mandatory, but a check
			# is performed to ensure IGIR will not error if using backups
			# Directory does not have to exist, and will not be created if not using backups


    # Atari #

_2600_backup="$_2600_output/../backup"

_5200_backup="$_5200_output/../backup"

_7800_backup="$_7800_output/../backup"

