#!/bin/bash

# This config file uses defaults based on my needs for a US+WORLD 1G1R set
# with Exclusions that only contains retail games sold during the systems lifespan in stores
# Configure everything to suit your own needs, I have left these settings in simply as an example
# IGIR Shell Tools MUST be restarted to pick up any changes to this file


                    ##### \\\\\ These settings are MANDATORY and can not be empty ///// #####


### Path to IGIR - Relative or Absolute
igir_binary="igir"


			### DAT File
			### Absolute or relative path from IGIRST.SH, wildcards in the DAT path work.
			### If using a wildcard, ensure only 1 DAT exists for the system


    # Atari #

_2600_dat="dats/atari/Atari - Atari 2600 (Parent-Clone)*.*"

_5200_dat="dats/atari/Atari - Atari 5200 (Parent-Clone)*.*"

_7800_dat="dats/atari/Atari - Atari 7800 (BIN) (Parent-Clone)*.*"

jaguar_dat="dats/atari/Atari - Atari Jaguar (J64) (Parent-Clone)*.*"

lynx_dat="dats/atari/Atari - Atari Lynx (LYX) (Parent-Clone)*.*"

    # NEC #

tg16_dat="dats/nec/NEC - PC Engine - TurboGrafx-16 (Parent-Clone)*.*"

    # Nintendo #

_3ds_dat="dats/nintendo/Nintendo - Nintendo 3DS (Decrypted) (Parent-Clone)*.*"

_64_dat="dats/nintendo/Nintendo - Nintendo 64 (BigEndian) (Parent-Clone)*.*"

ds_dat="dats/nintendo/Nintendo - Nintendo DS (Decrypted) (Parent-Clone)*.*"

